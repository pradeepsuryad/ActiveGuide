[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activeguide"
version = "0.2.0"
description = "Joint-space surgical virtual fixtures in MuJoCo, with a Remote Centre of Motion constraint, for the Franka Panda and the dVRK PSM"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pradeep Surya Dadi", email = "dadi.pr@northeastern.edu" }]
keywords = [
    "surgical-robotics", "virtual-fixtures", "active-constraints",
    "mujoco", "dvrk", "remote-center-of-motion", "quadratic-programming",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "mujoco>=3.9,<3.12",  # see requirements.txt
    "numpy",
    "scipy",
    "matplotlib",
    "glfw",
    "trimesh",
    # Joint-space QP controller. daqp is the default backend: this QP is small
    # and dense, the regime a dense active-set solver wins. Measured p99 on the
    # Panda reach task: daqp 1355 us, quadprog 1519 us, osqp 5371 us.
    "qpsolvers>=4.13",
    "daqp",
    "quadprog",
]

[project.optional-dependencies]
# Video output for demo_phase2; plots and metrics work without it.
media = ["imageio", "imageio-ffmpeg", "pillow"]

[project.urls]
Homepage = "https://github.com/pradeepsuryad/ActiveGuide"

[tool.setuptools]
packages = ["activeguide"]
